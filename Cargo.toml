[workspace]
resolver = "3"
members = ["core", "seal", "accountlog", "methods", "methods/guest", "cli", "tools/shortlist", "tools/engine-test", "board/core", "board/methods", "board/methods/guest", "testimonial/core", "testimonial/methods", "testimonial/methods/guest", "testimonial/engine-test", "testimonial/engine-test/forwarder", "testimonial/engine-test/forwarder/guest", "testimonial/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
names_core = { path = "core" }
names_seal = { path = "seal" }
names_accountlog = { path = "accountlog" }
board_core = { path = "board/core" }
testimonial_core = { path = "testimonial/core" }

# Pinned to LEZ v0.4.0-rc1 on the lez-0.4 port branch.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
fee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["client"] }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
borsh = "1.5.7"
argon2 = "0.6"

# Same keccak patch LEZ applies, so the guest matches what the zone builds.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
