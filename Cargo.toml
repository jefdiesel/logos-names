[workspace]
resolver = "3"
members = ["core", "seal", "methods", "methods/guest", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
names_core = { path = "core" }
names_seal = { path = "seal" }

# Pinned to LEZ dev (v0.3.1 release candidate), which speaks node 0.3.1.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "4fba494e2fe14c12723e1822025d53a78c57fa06" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "4fba494e2fe14c12723e1822025d53a78c57fa06" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "4fba494e2fe14c12723e1822025d53a78c57fa06" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
borsh = "1.5.7"

# Same keccak patch LEZ applies, so the guest matches what the zone builds.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
