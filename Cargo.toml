[workspace]
resolver = "3"
members = ["core", "seal", "accountlog", "methods", "methods/guest", "cli", "tools/shortlist", "board/core", "board/methods", "board/methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
names_core = { path = "core" }
names_seal = { path = "seal" }
names_accountlog = { path = "accountlog" }
board_core = { path = "board/core" }

# Pinned to LEZ v0.3.1, which speaks node 0.3.1.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
borsh = "1.5.7"
argon2 = "0.6"

# Same keccak patch LEZ applies, so the guest matches what the zone builds.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
