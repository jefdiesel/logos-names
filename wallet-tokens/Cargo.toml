# Prototype: a fungible token program for LEZ 0.4 and a wallet client for it.
# Its own workspace, so it never joins the Names workspace. See docs/wallet/TOKENS.md;
# scripts/run-public.sh and scripts/run-private.sh are the recorded run.
[workspace]
resolver = "3"
members = ["core", "methods", "methods/guest", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
token_core = { path = "core", package = "wallet_tokens_core" }
# The same pins as Names on LEZ v0.4.0.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
risc0-zkvm = { version = "3.1.0", default-features = false, features = ["std"] }
borsh = "1.5.7"

# Same patches LEZ applies, so the guest matches what the zone builds.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "385adda1fa3b66d9aaa8b8fcc99ddc324d33ba32" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }
