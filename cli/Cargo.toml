[package]
name = "names_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "names"
path = "src/main.rs"

[features]
default = []
# `local-prove`: with RISC0_PROVER=local, private proofs run inside this process, capped by
# RAYON_NUM_THREADS, never through the external r0vm (whose all-core run panicked the Mac
# mini on 2026-11-06). For testing on a shared machine only: release builds leave it off and
# prove with the bundled r0vm as before. Note that with it built in, risc0 proves locally
# even when RISC0_PROVER is unset. A build without it, and with no r0vm to find, refuses
# every call that would run a program, before anything is sent (src/prover.rs).
local-prove = ["lee/prove"]

[dependencies]
names_core.workspace = true
names_seal.workspace = true
names_accountlog.workspace = true
board_core.workspace = true
lee_core.workspace = true
lee.workspace = true
common.workspace = true
sequencer_service_rpc.workspace = true
fee_core.workspace = true
system_accounts.workspace = true
wallet.workspace = true
clock_core.workspace = true
# The prototype token program's wire types (docs/wallet/TOKENS.md); its own workspace.
token_core = { path = "../wallet-tokens/core", package = "wallet_tokens_core" }
# Only to find the r0vm risc0 would use, as names starts (src/prover.rs).
risc0-zkvm.workspace = true
rzup = { version = "0.5.1", default-features = false }

anyhow = "1.0.98"
borsh.workspace = true
libc = "0.2"
clap = { version = "4.5.42", features = ["derive", "env"] }
clap_mangen = "0.2"
hex = "0.4.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ureq = "3"
futures = "0.3"
base64 = "0.22"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time"] }
