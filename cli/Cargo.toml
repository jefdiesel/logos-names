[package]
name = "names_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "names"
path = "src/main.rs"

[dependencies]
names_core.workspace = true
board_core.workspace = true
names_seal.workspace = true
names_accountlog.workspace = true
lee_core.workspace = true
lee.workspace = true
common.workspace = true
wallet.workspace = true
clock_core.workspace = true

anyhow = "1.0.98"
borsh.workspace = true
risc0-binfmt = "3.0.2"
risc0-zkos-v1compat = "=2.2.2"
# The executor, to count a call's cycles before sending it (the same feature LEZ uses).
risc0-zkvm = { workspace = true, features = ["client"] }
libc = "0.2"
clap = { version = "4.5.42", features = ["derive", "env"] }
clap_mangen = "0.2"
hex = "0.4.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ureq = "3"
futures = "0.3"
base64 = "0.22"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
