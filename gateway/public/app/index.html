<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Names</title>
<meta name="description" content="Look up a name on the Logos Execution Zone. Read in your browser, straight from the chain.">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Names">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="./">Names</a>
  <button type="button" id="settings-button" class="ghost" aria-expanded="false" aria-controls="settings">Settings</button>
</header>

<main>
  <form id="lookup" class="lookup" autocomplete="off">
    <label for="name" class="sr">Name</label>
    <input id="name" name="name" type="text" inputmode="text" autocapitalize="none" autocorrect="off"
           spellcheck="false" enterkeyhint="search" placeholder="Look up a name, e.g. jef" maxlength="40">
    <button type="submit" id="go">Look up</button>
  </form>

  <section id="settings" class="panel" hidden>
    <h2>Settings</h2>
    <p class="muted">These stay on this device.</p>
    <fieldset>
      <legend>Chain (RPC)</legend>
      <label class="choice"><input type="radio" name="rpc-choice" value="https://lez.buggers.online">
        <span><b>lez.buggers.online</b><small>Test chain. Allows browsers.</small></span></label>
      <label class="choice"><input type="radio" name="rpc-choice" value="https://testnet.lez.logos.co">
        <span><b>testnet.lez.logos.co</b><small>Logos testnet. Blocks browsers (CORS) for now.</small></span></label>
      <label class="choice"><input type="radio" name="rpc-choice" value="custom">
        <span><b>Other</b><small>Any JSON-RPC URL that allows browsers.</small></span></label>
      <input id="rpc-custom" type="url" inputmode="url" autocapitalize="none" spellcheck="false"
             placeholder="https://…" aria-label="Other RPC URL">
    </fieldset>
    <label class="field">Registry program
      <input id="registry" type="text" autocapitalize="none" spellcheck="false"></label>
    <label class="field">Board program
      <input id="board" type="text" autocapitalize="none" spellcheck="false"></label>
    <p id="settings-error" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" id="settings-save">Save</button>
      <button type="button" id="settings-reset" class="ghost">Reset</button>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <article id="card" class="card" hidden>
    <div class="head">
      <img id="avatar" class="avatar" alt="" width="72" height="72" hidden>
      <div class="who">
        <h1 id="display"></h1>
        <p id="bare" class="muted"></p>
      </div>
    </div>
    <p id="bio" class="bio" hidden></p>
    <ul id="facts" class="facts"></ul>
    <dl id="texts" class="texts"></dl>
  </article>

  <section id="page-box" class="box" hidden>
    <h2>Page</h2>
    <iframe id="page" title="The name's page" sandbox="allow-popups allow-popups-to-escape-sandbox"
            referrerpolicy="no-referrer" loading="lazy"></iframe>
    <p id="page-note" class="muted" hidden></p>
  </section>

  <section id="posts-box" class="box" hidden>
    <h2>Posts</h2>
    <ol id="posts" class="posts"></ol>
    <p id="posts-note" class="muted" hidden></p>
    <button type="button" id="more" class="ghost wide" hidden>View more</button>
  </section>

  <section id="intro" class="intro">
    <p>Type a name to see its card, page and posts. Everything is read straight from the chain in
      this browser; nothing in between learns which name you looked up.</p>
  </section>
</main>
</body>
</html>
