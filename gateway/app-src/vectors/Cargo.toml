# Checks the JavaScript transaction encoder against the real LEZ 0.4 Rust types and
# engine. Not part of the repo's workspace, and not part of any build or deployment.
# See README.md here.
[package]
name = "lns_js_vectors"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
names_core = { path = "../../../core" }
names_methods = { path = "../../../methods" }
# lez_nft v3 (branch v3-lez04) checked out next to this repo: <parent>/<this repo> and <parent>/lez-nft,
# as tools/engine-test needs it.
lez_nft_core = { path = "../../../../lez-nft/core" }
lez_nft_methods = { path = "../../../../lez-nft/methods" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
borsh = "1.5.7"
serde_json = "1"
sha2 = "0.10"

# Same patches LEZ applies (and the workspace's Cargo.toml).
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "385adda1fa3b66d9aaa8b8fcc99ddc324d33ba32" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }
