# Checks the JavaScript transaction encoder against the real LEZ 0.4 Rust types and
# engine. Not part of the repo's workspace, and not part of any build or deployment.
# See README.md here.
[package]
name = "lns_js_vectors"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
names_core = { path = "../../../core" }
names_methods = { path = "../../../methods" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
borsh = "1.5.7"
serde_json = "1"

# Same keccak patch LEZ applies (and the workspace's Cargo.toml).
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
