# Writes ../v8-core-vectors.json from compiled names_core and lez_nft_core (lez-nft
# checked out next to this repo, branch v3-lez04, as tools/engine-test expects):
#   cd basecamp-module/rust-lib/testdata/core-vectors && cargo run -- ../v8-core-vectors.json
# Never edit the JSON by hand.
[package]
name = "core_vectors"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
names_core = { path = "../../../../core" }
lez_nft_core = { path = "../../../../../lez-nft/core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0" }
borsh = "1.5.7"
hex = "0.4"
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "385adda1fa3b66d9aaa8b8fcc99ddc324d33ba32" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }
