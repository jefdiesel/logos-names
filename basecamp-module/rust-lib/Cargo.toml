[package]
name = "names"
version = "0.5.0"
edition = "2021"

# Standalone crate — the empty table keeps cargo from adopting the repository's
# workspace, which the module build cannot see.
[workspace]

[lib]
crate-type = ["staticlib"]

# Cargo.lock is committed — the builder feeds it to buildRustPackage. To
# regenerate it after changing dependencies, stage the SDK the path dep below
# points at, then resolve against it:
#   nix build github:logos-co/logos-module-builder/<rev>#rust-sdk-src -o logos-rust-sdk-src
#   (cd rust-lib && cargo generate-lockfile)

[dependencies]
aes-gcm = "0.10"
# Argon2id derives a name's identifier and key (registry v5, SPEC.md section 3).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Blake2b-256 names a Logos Blockchain deposit (its op id), which LEZ mints it under,
# and is the Mantle transaction hash of an inscription (chain_inscribe.rs).
blake2 = "0.10"
bs58 = "0.5"
# Names Messages version 1 (src/messages/): XChaCha20-Poly1305, X25519, HKDF and HMAC, as the phone app uses them.
chacha20poly1305 = "0.10"
# A testimonial inscribed on the Logos Blockchain is signed with Ed25519 (chain_inscribe.rs).
ed25519-dalek = "=2.2.0"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
# Decodes a name's avatar for apps that may not load `data:` URLs (avatar.rs).
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Staged by the builder from the same logos-rust-sdk revision its code
# generator comes from, so there is no generator/runtime skew to manage.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

# Deriving a name takes 64 MiB of Argon2id; unoptimised it takes seconds, so
# tests build it optimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
