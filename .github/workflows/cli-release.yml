name: CLI release build

# Builds the `names` command line for Linux x86_64. The macOS (Apple silicon)
# build is made on a Mac; both are published through the gateway (gateway/public/).
on:
  workflow_dispatch:
  push:
    tags: ["cli-v*"]

jobs:
  linux:
    name: names for linux-x86_64
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        # The LEZ wallet links PC/SC for hardware keycards.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config libpcsclite-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p names_cli
      - name: Package
        run: |
          cp target/release/names names-linux-x86_64
          strip names-linux-x86_64
          sha256sum names-linux-x86_64 | tee names-linux-x86_64.sha256
          ldd names-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: names-linux-x86_64
          path: |
            names-linux-x86_64
            names-linux-x86_64.sha256
