<!-- The Names Wallet app icon, the source of basecamp/src/icons/icon.png. Logos packages
     require the icon to be a PNG of exactly 256 by 256, with its own rounded tile.
     The mark is a plain black Greek eta (η) in Arial on a white tile, centred on the
     glyph (its ink spans 81..175 by 47..209). Export it with transparent corners, e.g.
       Chrome --headless=new --default-background-color=00000000 --window-size=256,256 \
         --screenshot=icon.png <a page holding this SVG with no margin> -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#ffffff"/>
  <text x="128" y="165" text-anchor="middle" font-family="Arial" font-size="220" fill="#000000">η</text>
</svg>
