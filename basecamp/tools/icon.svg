<!-- The Names Wallet app icon, the source of basecamp/src/icons/icon.png. Logos packages
     require the icon to be a PNG of exactly 256 by 256, with its own rounded tile.
     The mark is the Greek eta (η) of the Names Wallet, the same drawing as on Android and
     the website (~/logos/android-node/names-eta-mark.svg): cream on a forest-green disc,
     on a cream tile. Export it with transparent corners, for example:
       Chrome --headless=new --default-background-color=00000000 --window-size=256,256 \
         --screenshot=icon.png <a page holding this SVG with no margin> -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#f4f2ec"/>
  <circle cx="128" cy="128" r="104" fill="#1f4d36"/>
  <g transform="translate(128 128) scale(7.2) translate(-11.25 -13.65)" fill="none" stroke="#f4f2ec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.3 7.6L8 7.1V15.6M8 10.7C9.2 8.4 10.8 7.2 12.7 7.2C15 7.2 16.2 8.7 16.2 11.4V20.2"/>
  </g>
</svg>
