<!-- The Names Wallet app icon, the source of basecamp/src/icons/icon.png. Logos packages
     require the icon to be a PNG of exactly 256 by 256, with its own rounded tile.
     The mark is a white Greek eta (η) in Arial Bold on Logos orange (#F57A02), the style all
     our apps share, centred on the letter body, slimmed to the stroke of the capital N. Export it with transparent corners, e.g.
       Chrome --headless=new --default-background-color=00000000 --window-size=256,256 \
         --screenshot=icon.png <a page holding this SVG with no margin> -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#F57A02"/>
  <text x="128" y="159" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="166" fill="#ffffff" stroke="#F57A02" stroke-width="5.25">η</text>
</svg>
