# -----------------------------------------------------------------------------
# Post-deploy end-to-end verification (`post-deploy.sh`)
# -----------------------------------------------------------------------------
[post_deploy]
# Non-locked 8+ char names used to test real public (5m wait) and private (15m wait)
# registrations end to end. Pick fresh names (not on the reserved list).
smoke_public_name = "lns-smoke-pub-v04"
smoke_private_name = "lns-smoke-priv-v04"
smoke_term = "30d"

# Optional separate test wallet directory (`LEE_WALLET_HOME_DIR`) for smoke tests
# so smoke accounts stay separate from the admin/treasury deployer wallet.
# Leave empty to reuse the active wallet (with non-admin accounts).
smoke_wallet_dir = ""

# Accounts used for the public & private E2E checks (must NOT be `treasury` so
# real fee payment to `treasury` is exercised, and must NOT be `admin` so the
# non-membership shortlist proof path is exercised).
smoke_public_owner = ""    # "Public/<base58>"
smoke_private_owner = ""   # "Private/<base58>"

# Name whose tied NFT mint & lockstep link will be checked on `lez_nft` v3.
# Defaults to `smoke_public_name` if empty.
nft_check_name = ""
